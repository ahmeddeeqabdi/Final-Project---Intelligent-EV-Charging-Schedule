spring:
  application:
    name: ev-charging-scheduler

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: always

energidataservice:
  base-url: https://api.energidataservice.dk
  default-zone: DK2

scheduling:
  enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:this-is-a-development-only-secret-key-with-more-than-thirty-two-characters}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}

resilience:
  eds:
    failure-rate-threshold: 50
    sliding-window-size: 10
    wait-duration-open-seconds: 30
    permitted-half-open-calls: 3
    request-timeout-seconds: 8
    fallback-max-age-hours: 48

---
spring:
  config:
    activate:
      on-profile: local

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:file:./.data/evcharging;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
