spring:
  application:
    name: ev-charging-scheduler

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

energidataservice:
  base-url: https://api.energidataservice.dk
  default-zone: DK2

scheduling:
  enabled: true

app:
  security:
    username: ${APP_SECURITY_USERNAME}
    password: ${APP_SECURITY_PASSWORD}

resilience:
  eds:
    failure-rate-threshold: 50
    sliding-window-size: 10
    wait-duration-open-seconds: 30
    permitted-half-open-calls: 3
    request-timeout-seconds: 8
    fallback-max-age-hours: 48
